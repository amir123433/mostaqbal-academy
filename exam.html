<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امتحان الورشة | منصة المستقبل</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#eaf3ff;background:#07111f}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px}header,.panel{background:#0d1b2d;border:1px solid #233b58;border-radius:18px;padding:22px;margin-bottom:18px}h1{margin:0 0 12px}p{line-height:1.7}.muted{color:#a9bdd3}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.timer{font-size:22px;font-weight:bold;color:#f9cb76}.question{margin:16px 0;padding:18px;border-radius:14px;background:#11263e;border:1px solid #294460}.question h3{font-size:17px;line-height:1.7;direction:ltr;text-align:left}.choice{display:block;direction:ltr;text-align:left;background:#0a192c;padding:12px;border-radius:10px;margin:8px 0;cursor:pointer}.choice:has(input:checked){outline:2px solid #4fb8ee}input{margin-right:9px}button{border:0;border-radius:12px;padding:14px 20px;background:#37a7e7;color:#041524;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.good{color:#7ee2ac}.bad{color:#ff9d9d}.notice{border-right:4px solid #e5b65c;padding:10px;background:#2a2730}.actions{display:flex;gap:12px;flex-wrap:wrap}a{color:#88d2ff}</style></head><body><main class="wrap"><header><h1>📘 امتحان ورشة Units 1, 2 & 3</h1><div class="top"><span>20 سؤال • 20 درجة • 30 دقيقة</span><span class="timer" id="clock">30:00</span></div><p class="muted">اختر إجابة واحدة لكل سؤال. عند انتهاء الوقت يتم تسليم الإجابات تلقائيًا.</p><p id="status" class="muted">جارٍ التحقق من تسجيل الدخول...</p></header><section id="quiz" class="panel hidden"><div id="questions"></div><div class="actions"><button id="submit">تسليم الامتحان</button><span id="progress" class="muted"></span></div></section><section id="result" class="panel hidden" aria-live="polite"></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getDatabase,ref,push,set} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
// ضع هنا إعدادات Firebase نفسها المستخدمة في ملفات المنصة (لا تضع مفاتيح سرية أو كلمات مرور).
const firebaseConfig={apiKey:'REPLACE_ME',authDomain:'mostaqbal-academy-5f51b.firebaseapp.com',databaseURL:'https://mostaqbal-academy-5f51b-default-rtdb.europe-west1.firebasedatabase.app',projectId:'mostaqbal-academy-5f51b',appId:'REPLACE_ME'};
const questions=[
['The researcher _____ her discoveries in a detailed report.',['appeared','documented','destroyed','forgot'],1],
['You crossed the street without looking! You _____ been hurt.',['could have','cannot have','must have','should have'],0],
['Please help _____ to some cake, everyone.',['yourself','you','yourselves','your'],2],
['The manager did not want her colleague to take the _____ for her mistake.',['loss','profit','blame','benefit'],2],
['Oh no! I _____ my phone, and now it will not work.',['break','had broken','was broken','have broken'],3],
['The technician checked the measurements _____ to prevent errors.',['accurately','dependently','imaginatively','productively'],0],
['“You should review your choices,” Ali said. Ali advised me that I _____ my choices.',['reviewed','must reviewed','should review','might reviewing'],2],
['Her enthusiasm helped _____ the whole team towards success.',['troubleshoot','boast','embrace','drive'],3],
['My friend suggests _____ for the last bus because it is already too late.',['to wait','not waiting','we waited','do not waiting'],1],
['Farmers _____ animals to provide milk and other products.',['raise','rise','arise','arouse'],0],
['They _____ each other since primary school.',['have known','have been knowing','had been knowing','are knowing'],0],
['“Sara grabbed the bag.” The word “grabbed” is closest in meaning to _____.',['threw','ignored','released','clutched'],3],
['My pair of sunglasses _____ on the table.',['are','is','are not','have'],1],
['A _____ is a rigid bar that helps move or lift something.',['lever','automation','infrastructure','driver'],0],
['She _____ an excellent chef; everyone loves her food.',['cannot be','must be','may not be','is not'],1],
['The rescue dog managed to _____ the missing object by its smell.',['decide','detect','infect','hear'],1],
['Mona says she _____ her grandparents after the exams.',['has visited','will visit','would visit','had visited'],1],
['Factories can release harmful _____ into the atmosphere.',['liquids','footprints','emissions','solids'],2],
['When I asked Nour about the call, she said she _____ her friend that morning.',['did not speak','was not speaking','had spoken to','has spoken to'],2],
['The seasonal movement of animals from one region to another is called _____.',['precaution','phenomenon','migration','recognition'],2]
];
const $=id=>document.getElementById(id);let user=null,seconds=1800,tick=null,done=false;const answers=Array(questions.length).fill(null);const examId='units-1-2-3-workshop';
function render(){ $('questions').innerHTML=questions.map((q,i)=>`<article class="question"><h3>${i+1}. ${q[0]}</h3>${q[1].map((c,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''}> ${'abcd'[j]}) ${c}</label>`).join('')}</article>`).join('');$('questions').addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){answers[Number(e.target.name.slice(1))]=Number(e.target.value);updateProgress()}});updateProgress()}
function updateProgress(){$('progress').textContent=`تمت الإجابة عن ${answers.filter(v=>v!==null).length} من 20`}
function updateClock(){const m=Math.floor(seconds/60),s=seconds%60;$('clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
async function finish(auto=false){if(done)return;const missing=answers.filter(v=>v===null).length;if(!auto&&missing&&!confirm(`هناك ${missing} أسئلة بلا إجابة. هل تريد التسليم؟`))return;done=true;clearInterval(tick);$('submit').disabled=true;const score=questions.reduce((n,q,i)=>n+(answers[i]===q[2]?1:0),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<h2>نتيجتك: ${score} / 20</h2><p>عدد الإجابات الصحيحة: ${score}، والخاطئة أو المتروكة: ${20-score}.</p><p id="saveStatus">جارٍ حفظ النتيجة...</p><a href="courses.html">العودة للكورسات</a>`;try{const db=getDatabase();const entry=push(ref(db,`examResults/${user.uid}/${examId}`));await set(entry,{examId,score,total:20,answers,submittedAt:Date.now(),durationSeconds:1800-seconds});$('saveStatus').textContent='✅ تم حفظ النتيجة في Firebase.'}catch(e){$('saveStatus').innerHTML='<span class="bad">تعذر حفظ النتيجة. راجع إعدادات Firebase وقواعد قاعدة البيانات. احتفظ بصورة للدرجة.</span>';console.error(e)}}
$('submit').onclick=()=>finish(false);if(firebaseConfig.apiKey==='REPLACE_ME'||firebaseConfig.appId==='REPLACE_ME'){$('status').innerHTML='<span class="bad">يجب إدخال إعدادات Firebase الصحيحة في ملف exam.html أولًا.</span>'}else{try{const app=initializeApp(firebaseConfig);onAuthStateChanged(getAuth(app),u=>{if(!u){$('status').innerHTML='سجّل دخولك أولًا من <a href="login.html">صفحة الدخول</a>.';return}user=u;$('status').textContent=`تم تسجيل الدخول: ${u.email||'طالب'}`;$('quiz').classList.remove('hidden');render();updateClock();tick=setInterval(()=>{seconds--;updateClock();if(seconds<=0)finish(true)},1000)},e=>{$('status').textContent='خطأ في التحقق من الحساب: '+e.message})}catch(e){$('status').textContent='تعذر تشغيل Firebase: '+e.message}}
</script></body></html>
