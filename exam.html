<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امتحان الورشة | منصة المستقبل</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#eaf3ff;background:#07111f}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px}header,.panel{background:#0d1b2d;border:1px solid #233b58;border-radius:18px;padding:22px;margin-bottom:18px}h1{margin:0 0 12px}p{line-height:1.7}.muted{color:#a9bdd3}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.timer{font-size:22px;font-weight:bold;color:#f9cb76}.question{margin:16px 0;padding:18px;border-radius:14px;background:#11263e;border:1px solid #294460}.question h3{font-size:17px;line-height:1.7;direction:ltr;text-align:left}.choice{display:block;direction:ltr;text-align:left;background:#0a192c;padding:12px;border-radius:10px;margin:8px 0;cursor:pointer}.choice:has(input:checked){outline:2px solid #4fb8ee}input{margin-right:9px}button{border:0;border-radius:12px;padding:14px 20px;background:#37a7e7;color:#041524;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.good{color:#7ee2ac}.bad{color:#ff9d9d}.notice{border-right:4px solid #e5b65c;padding:10px;background:#2a2730}.actions{display:flex;gap:12px;flex-wrap:wrap}a{color:#88d2ff}
.review-item{margin:14px 0;padding:16px;border-radius:13px;background:#11263e;border:1px solid #294460}
.review-item h3{direction:ltr;text-align:left;line-height:1.7;font-size:16px}
.review-item p{margin:7px 0}
.review-item .correct-answer{color:#7ee2ac}
.review-item .wrong-answer{color:#ff9d9d}
.score-big{font-size:32px;font-weight:800;color:#f9cb76}
.review-title{margin-top:28px;border-bottom:1px solid #294460;padding-bottom:10px}</style></head><body><main class="wrap"><header><h1>📘 امتحان ورشة Units 1, 2 & 3</h1><div class="top"><span>20 سؤال • 20 درجة • 30 دقيقة</span><span class="timer" id="clock">30:00</span></div><p class="muted">اختر إجابة واحدة لكل سؤال. عند انتهاء الوقت يتم تسليم الإجابات تلقائيًا.</p><p id="status" class="muted">جارٍ التحقق من تسجيل الدخول...</p></header><section id="startPanel" class="panel hidden"><h2 id="startTitle">هل أنت مستعد؟</h2><p id="startInfo" class="muted">لديك محاولتان فقط. مدة المحاولة 30 دقيقة، والوقت يستمر حتى لو خرجت من الصفحة.</p><button id="startButton" type="button">ابدأ الامتحان</button></section><section id="quiz" class="panel hidden"><div id="questions"></div><div class="actions"><button id="submit">تسليم الامتحان</button><span id="progress" class="muted"></span></div></section><section id="result" class="panel hidden" aria-live="polite"></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getDatabase,ref,push,set,get} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
// ضع هنا إعدادات Firebase نفسها المستخدمة في ملفات المنصة (لا تضع مفاتيح سرية أو كلمات مرور).
const firebaseConfig={apiKey:'AIzaSyDtyyxxeUvmjon7tivpS1Kga2GdXlnCaQ4',authDomain:'mostaqbal-academy-5f51b.firebaseapp.com',databaseURL:'https://mostaqbal-academy-5f51b-default-rtdb.europe-west1.firebasedatabase.app',projectId:'mostaqbal-academy-5f51b',appId:'1:398450175799:web:83a302dac12387bc3234b2'};
const questions=[
['The researcher _____ her discoveries in a detailed report.',['appeared','documented','destroyed','forgot'],1],
['You crossed the street without looking! You _____ been hurt.',['could have','cannot have','must have','should have'],0],
['Please help _____ to some cake, everyone.',['yourself','you','yourselves','your'],2],
['The manager did not want her colleague to take the _____ for her mistake.',['loss','profit','blame','benefit'],2],
['Oh no! I _____ my phone, and now it will not work.',['break','had broken','was broken','have broken'],3],
['The technician checked the measurements _____ to prevent errors.',['accurately','dependently','imaginatively','productively'],0],
['“You should review your choices,” Ali said. Ali advised me that I _____ my choices.',['reviewed','must reviewed','should review','might reviewing'],2],
['Her enthusiasm helped _____ the whole team towards success.',['troubleshoot','boast','embrace','drive'],3],
['My friend suggests _____ for the last bus because it is already too late.',['to wait','not waiting','we waited','do not waiting'],1],
['Farmers _____ animals to provide milk and other products.',['raise','rise','arise','arouse'],0],
['They _____ each other since primary school.',['have known','have been knowing','had been knowing','are knowing'],0],
['“Sara grabbed the bag.” The word “grabbed” is closest in meaning to _____.',['threw','ignored','released','clutched'],3],
['My pair of sunglasses _____ on the table.',['are','is','are not','have'],1],
['A _____ is a rigid bar that helps move or lift something.',['lever','automation','infrastructure','driver'],0],
['She _____ an excellent chef; everyone loves her food.',['cannot be','must be','may not be','is not'],1],
['The rescue dog managed to _____ the missing object by its smell.',['decide','detect','infect','hear'],1],
['Mona says she _____ her grandparents after the exams.',['has visited','will visit','would visit','had visited'],1],
['Factories can release harmful _____ into the atmosphere.',['liquids','footprints','emissions','solids'],2],
['When I asked Nour about the call, she said she _____ her friend that morning.',['did not speak','was not speaking','had spoken to','has spoken to'],2],
['The seasonal movement of animals from one region to another is called _____.',['precaution','phenomenon','migration','recognition'],2]
];

const $=id=>document.getElementById(id);
let user=null,db=null,seconds=1800,tick=null,done=false,session=null;
const answers=Array(questions.length).fill(null),examId='units-1-2-3-workshop';
const controlRef=()=>ref(db,`examResults/${user.uid}/${examId}/_control`);
function updateClock(){const m=Math.floor(seconds/60),s=seconds%60;$('clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function updateProgress(){$('progress').textContent=`تمت الإجابة عن ${answers.filter(v=>v!==null).length} من 20`;}
function render(){
 $('questions').innerHTML=questions.map((q,i)=>`<article class="question"><h3>${i+1}. ${q[0]}</h3>${q[1].map((c,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''}> ${'abcd'[j]}) ${c}</label>`).join('')}</article>`).join('');
 $('questions').onchange=async e=>{if(!e.target.matches('input[type=radio]'))return;answers[+e.target.name.slice(1)]=+e.target.value;updateProgress();try{await set(ref(db,`examResults/${user.uid}/${examId}/_control/active/answers`),answers);}catch(err){console.error(err);}};
 updateProgress();
}
function review(){
 return `<h2 class="review-title">📝 تصحيح إجاباتك</h2>`+questions.map((q,i)=>{let s=answers[i],c=q[2],ok=s===c;return `<article class="review-item"><h3>${i+1}. ${q[0]}</h3><p class="${ok?'correct-answer':'wrong-answer'}">${ok?'✓ إجابة صحيحة':'✗ إجابة غير صحيحة'}</p><p>إجابتك: ${s===null?'لم يتم اختيار إجابة':`${'abcd'[s]}) ${q[1][s]}`}</p><p class="correct-answer">الإجابة الصحيحة: ${'abcd'[c]}) ${q[1][c]}</p></article>`}).join('');
}
function showStart(c){
 $('quiz').classList.add('hidden');$('result').classList.add('hidden');$('startPanel').classList.remove('hidden');
 const count=Number(c?.attemptCount)||0;
 session=c?.active||null;
 if(session){$('startTitle').textContent='لديك امتحان غير مكتمل';$('startInfo').textContent='يمكنك استكمال الامتحان من حيث توقفت. الوقت يستمر أثناء خروجك.';$('startButton').textContent='استكمال الامتحان';$('startButton').disabled=false;}
 else if(count>=2){$('startTitle').textContent='انتهت المحاولات المتاحة';$('startInfo').textContent='لقد استخدمت المحاولتين المسموح بهما.';$('startButton').textContent='اكتملت المحاولات';$('startButton').disabled=true;}
 else{$('startTitle').textContent='هل أنت مستعد؟';$('startInfo').textContent=`متاح لك ${2-count} محاولة. يبدأ الوقت عند الضغط على ابدأ الامتحان ويستمر حتى لو خرجت.`;$('startButton').textContent='ابدأ الامتحان';$('startButton').disabled=false;}
}
async function begin(){
 try{
  if(!session){
   const tx=await runTransaction(controlRef(),c=>{c=c||{attemptCount:0};if(c.active||Number(c.attemptCount||0)>=2)return;c.attemptCount=Number(c.attemptCount||0)+1;const now=Date.now();c.active={startedAt:now,expiresAt:now+1800000,answers:Array(questions.length).fill(null)};return c;});
   if(!tx.committed){showStart(tx.snapshot.val()||{attemptCount:2});return;}
   session=tx.snapshot.val().active;
  }
  answers.splice(0,answers.length,...(Array.isArray(session.answers)?session.answers:Array(questions.length).fill(null)));
  $('startPanel').classList.add('hidden');$('quiz').classList.remove('hidden');render();
  seconds=Math.max(0,Math.ceil((Number(session.expiresAt)-Date.now())/1000));updateClock();
  if(seconds<=0){await finish(true);return;}
  clearInterval(tick);tick=setInterval(()=>{seconds=Math.max(0,Math.ceil((Number(session.expiresAt)-Date.now())/1000));updateClock();if(seconds<=0)finish(true);},500);
 }catch(e){$('status').textContent='تعذر بدء أو استكمال الامتحان: '+e.message;}
}
async function finish(auto=false){
 if(done||!user)return;
 const missing=answers.filter(v=>v===null).length;if(!auto&&missing&&!confirm(`هناك ${missing} أسئلة بلا إجابة. هل تريد التسليم؟`))return;
 done=true;clearInterval(tick);$('submit').disabled=true;
 const score=questions.reduce((n,q,i)=>n+(answers[i]===q[2]?1:0),0);
 $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
 $('result').innerHTML=`<h2>نتيجة الامتحان</h2><div class="score-big">${score} / 20</div><p>النسبة المئوية: ${Math.round(score/20*100)}%</p><p>الإجابات الصحيحة: ${score} — الخاطئة أو المتروكة: ${20-score}</p><p id="saveStatus">جارٍ حفظ النتيجة...</p>${review()}<p><a href="student.html">العودة لملف الطالب</a></p>`;
 try{
  await set(push(ref(db,`examResults/${user.uid}/${examId}/attempts`)),{examId,score,total:20,answers:[...answers],submittedAt:Date.now(),durationSeconds:Math.min(1800,Math.max(0,1800-seconds))});
  await runTransaction(controlRef(),c=>{if(!c)return c;c.active=null;return c;});
  const boardRef=ref(db,`leaderboard/${user.uid}`),snap=await get(boardRef),old=snap.exists()?snap.val():{};
  const best=old.bestScores&&typeof old.bestScores==='object'?old.bestScores:{},previous=Number(best[examId]||0);
  best[examId]=Math.max(previous,score);const totalScore=Object.values(best).reduce((a,v)=>a+(Number(v)||0),0),count=Object.keys(best).length,now=Date.now();
  await set(boardRef,{displayName:old.displayName||`طالب ${Math.floor(1000+Math.random()*9000)}`,bestScores:best,examsCount:count,score:totalScore,total:count*20,submittedAt:now,updatedAt:now});
  $('saveStatus').textContent='✅ تم حفظ المحاولة وتحديث أعلى درجة.';
 }catch(e){$('saveStatus').textContent='تعذر حفظ النتيجة. تحقق من الإنترنت وقواعد Firebase.';console.error(e);}
}
$('submit').onclick=()=>finish(false);$('startButton').onclick=begin;
try{
 const app=initializeApp(firebaseConfig);const auth=getAuth(app);db=getDatabase(app);
 onAuthStateChanged(auth,async u=>{
  if(!u){$('status').innerHTML='سجّل دخولك أولًا من <a href="login.html">صفحة الدخول</a>.';return;}
  user=u;$('status').textContent='تم تسجيل الدخول، جارٍ تحميل حالة الامتحان...';
  try{const s=await get(controlRef());showStart(s.exists()?s.val():{attemptCount:0});$('status').textContent=`تم تسجيل الدخول: ${u.email||'طالب'}`;}
  catch(e){$('status').textContent='تعذر قراءة حالة الامتحان: '+e.message;}
 },e=>$('status').textContent='خطأ في التحقق من الحساب: '+e.message);
}catch(e){$('status').textContent='تعذر تشغيل Firebase: '+e.message;}

</script></body></html>
